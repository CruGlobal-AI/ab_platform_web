name: E2E Tests
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      CYPRESS_RESPONSE_TIMEOUT: 200000
      CYPRESS_DEFAULT_COMMAND_TIMEOUT: 30000
      CYPRESS_RETRIES: 2
    strategy:
      fail-fast: true
      matrix:
        include:
          - branch: develop
            webpack: dev
          - branch: master
            webpack: update
    steps:
      - uses: actions/checkout@v4
        with:
          path: ab_platform_web
          submodules: true
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v4
        with:
          path: web
          repository: ${{ github.repository_owner }}/ab_service_web
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ matrix.branch }}

      - run: npm i
        working-directory: ./ab_platform_web

      - name: Webpack
        run: npm run build:${{ matrix.webpack }}
        working-directory: ./ab_platform_web

      # webpack expects the folder to be called "web" ab-install action expects "ab_service_web"
      - run: mv web ab_service_web

      - uses: CruGlobal-AI/ab-install-action@v1
        with:
          port: 8080
          folder: ab
          repository: ${{ github.repository_owner }}/ab_service_web

      - name: Check out kitchen-sink tests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kitchensink_app
          path: ab/test/e2e/cypress/e2e/kitchensink_app

      # These next steps are to save our ablogs to file
      - run: npm install pm2@latest -g
      - name: Save Logs
        run: pm2 start ./logs.js -- --toFile logs/ABServices.log
        working-directory: ./ab

      #Run test
      - name: Wait for AB
        # Skipping the wait step. Cypress has a bit of wait time built in. It might be enough.
        if: false
        uses: ifaxity/wait-on-action@v1.1.0
        with:
          resource: http://localhost:8080
          timeout: 300000

      - name: DEBUG before Cypress
        if: always()
        working-directory: ./ab
        run: |
          echo "CYPRESS_STACK=$(grep -E '^CYPRESS_STACK=' .env | cut -d= -f2-)"
          docker ps --format '{{.Names}}  {{.Image}}' | grep -i -E "db|migration" || true
          echo "(no reset)"
          ID=$(docker ps | grep "$(grep -E '^CYPRESS_STACK=' .env | cut -d= -f2-)_db" | awk '{print $1}')
          echo "db container: $ID"
          docker exec $ID sh -c 'mysql -u"$DB_USER" -p"$DB_PASSWORD" -e "SHOW TABLES FROM \`appbuilder-$TENANT\` LIKE \"SITE_PLUGIN%\"; SELECT \`key\`,\`value\` FROM \`appbuilder-$TENANT\`.SITE_CONFIG WHERE \`key\`=\"migration-last-patch\";"' 2>&1 | grep -v "Using a password"

      - name: Run Cypress Tests
        run: npm run test:e2e:app -- --browser chrome
        working-directory: ./ab

      - name: DEBUG after Cypress (run testReset.sh)
        if: always()
        working-directory: ./ab
        run: |
          echo "CYPRESS_STACK=$(grep -E '^CYPRESS_STACK=' .env | cut -d= -f2-)"
          docker ps --format '{{.Names}}  {{.Image}}' | grep -i -E "db|migration" || true
          echo "===== testReset.sh output ====="; bash -x testReset.sh 2>&1 | tail -60; echo "exit=${PIPESTATUS[0]}"
          ID=$(docker ps | grep "$(grep -E '^CYPRESS_STACK=' .env | cut -d= -f2-)_db" | awk '{print $1}')
          echo "db container: $ID"
          docker exec $ID sh -c 'mysql -u"$DB_USER" -p"$DB_PASSWORD" -e "SHOW TABLES FROM \`appbuilder-$TENANT\` LIKE \"SITE_PLUGIN%\"; SELECT \`key\`,\`value\` FROM \`appbuilder-$TENANT\`.SITE_CONFIG WHERE \`key\`=\"migration-last-patch\";"' 2>&1 | grep -v "Using a password"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ./ab/test/e2e/cypress/screenshots

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ABServices.log
          path: ./ab/logs/ABServices.log
