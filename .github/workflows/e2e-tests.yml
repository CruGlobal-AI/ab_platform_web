name: E2E Tests
# Thin wrapper around the shared workflow (image pre-pull, caching, readiness wait):
# https://github.com/CruGlobal-AI/ab-workflows/blob/main/.github/workflows/cypress-e2e-tests.yml
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
jobs:
  e2e-tests:
    name: E2E Tests
    uses: CruGlobal-AI/ab-workflows/.github/workflows/cypress-e2e-tests.yml@main
    with:
      ref: ${{ inputs.ref }}
      config: app
      build_web: true
      # webpack writes into ../web
      checkout_path: ab_platform_web
      folder: ab
      port: "8080"
