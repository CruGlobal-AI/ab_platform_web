version: 2
updates:
   - package-ecosystem: "npm"
     directory: "/"
     schedule:
        interval: "daily"
     allow:
        - dependency-name: "@digiserve/ab-utils"
   - package-ecosystem: "github-actions"
     directory: "/"
     schedule:
        interval: "weekly"
     groups:
        github-actions:
           patterns: ["*"]
